name = "nusakit-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database for wilayah data
[[d1_databases]]
binding = "DB"
database_name = "nusakit-db"
database_id = "REPLACE_WITH_D1_ID"

# KV Namespace for caching
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
API_VERSION = "v1"
CORS_ORIGIN = "*"
